name: Package installers and website

# Netlify 배포: 웹 게임(PWA) + 설치·사용 안내 페이지(/guide/) + PC 설치 파일(/downloads/)을 한 번에 올린다.
#  · v* 태그를 push 하면 자동 실행 (예: git tag v0.2.0 && git push origin v0.2.0)
#  · Actions 탭 → "Package installers and website" → Run workflow 로 언제든 수동 실행
# 필요한 설정(docs/NETLIFY.md): Secret NETLIFY_AUTH_TOKEN, Variable NETLIFY_SITE_ID, (선택) Variable SITE_URL
on:
  workflow_dispatch:
  push:
    branches: ['codex/package-release', 'codex/festival-adventure', 'codex/word-listening-rpg']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($VERSION). Run: npm run version:set -- <version>"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # 키를 새로 만들거나 검증을 우회하지 않는다. 이 묶음은 수동 설치용이다.
      - name: Build manually installable desktop app
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg

  website:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: work/desktop-artifacts
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run release:downloads -- work/desktop-artifacts
      # 수동 업로드에도 업데이트 캐시 정책이 유지되도록 publish 폴더에 둔다.
      - run: cp public/_headers dist/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: school-quest-netlify-site
          if-no-files-found: error
          path: dist
      - name: Check Netlify deployment credentials
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Netlify credentials absent. Download school-quest-netlify-site and upload its contents to Netlify." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy prepared website and installers
        if: steps.netlify.outputs.enabled == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@23 deploy --prod --dir dist --no-build --message "${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
      - name: Summary
        if: steps.netlify.outputs.enabled == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          {
            echo "### Netlify 배포 완료"
            if [ -n "$SITE_URL" ]; then
              echo "- 게임: $SITE_URL/"
              echo "- 설치·사용 안내: $SITE_URL/guide/"
              echo "- 설치 파일 목록: $SITE_URL/downloads/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
