# Netlify 설정.
# 권장 배포 방식은 GitHub Actions(.github/workflows/release.yml)가 PC 설치 파일까지 함께 올리는 것이다.
# 이 파일의 build 설정은 내 컴퓨터에서 `npx netlify-cli deploy --build` 로 웹만 올릴 때 쓰인다.
# 헤더와 짧은 주소 규칙은 public/_headers, public/_redirects 에 있다.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
