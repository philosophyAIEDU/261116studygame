[package]
name = "my-american-school-quest"
version = "0.3.0"
description = "My American School Quest - learn English like a first language"
edition = "2021"
publish = false

[lib]
name = "school_quest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 자동 업데이트는 데스크톱(Windows·macOS·Linux)에서만 쓴다.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
